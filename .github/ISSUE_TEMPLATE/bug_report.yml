name: Bug report
description: Something does not work as described in the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real subscription URLs, proxy links or credentials.** Replace hosts, UUIDs,
        passwords and keys with fake values. Security problems go to a private advisory, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Command you ran, what you expected and what you got.
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options: [VLESS, VMess, Trojan, Shadowsocks, Hysteria2, WireGuard, SOCKS5 / HTTP, Not related]
    validations:
      required: true
  - type: textarea
    id: link-shape
    attributes:
      label: Redacted link or config
      description: The link with every secret replaced, so the format is visible.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Service worker console output (chrome://extensions → Inspect), redacted.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: macOS, Chrome version, `sing-box version` and `python3 --version` if you use local sing.
    validations:
      required: true
  - type: checkboxes
    id: redacted
    attributes:
      label: Check
      options:
        - label: I removed all real hosts, keys, passwords and subscription URLs.
          required: true
