<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sing VPN</title><link rel="stylesheet" href="popup.css"></head><body><div id="ip-banner" class="ip-banner">Checking IP…</div><main><section id="view-home" class="view"><button id="location-card" class="card location-card" type="button"><span id="home-flag" class="flag"></span> <span class="location-text"><span class="muted">Chosen location</span> <span id="home-location" class="location-name">—</span></span></button><div class="power-wrap"><button id="power" class="power" type="button" aria-label="Connect / disconnect"><svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button><p id="status" class="status">Not connected</p><p id="live-latency" class="live-latency" hidden></p><p id="error" class="error" hidden></p></div><div id="fast-list" class="fast-list" aria-label="Fastest locations"></div></section><section id="view-locations" class="view" hidden><header class="locations-head"><h1>Locations</h1><input id="search" type="search" placeholder="Search" aria-label="Search locations"> <button id="add-toggle" class="icon-button" type="button" aria-label="Add servers">+</button></header><p id="list-note" class="muted hint" hidden></p><form id="add-panel" class="card add-panel" hidden><textarea id="add-links" rows="4" spellcheck="false" placeholder="https://user:pass@host:443#Name&#10;socks5://host:1080#Name"></textarea> <input id="add-subscription" type="url" placeholder="Subscription URL (https://…)" spellcheck="false"> <button class="primary" type="submit">Add</button><p id="add-message" class="muted hint" hidden></p></form><ul id="location-list" class="card location-list"></ul></section><section id="view-account" class="view" hidden><h1>Account</h1><dl class="card account-list"><dt>Servers</dt><dd id="acc-count">0</dd><dt>Proxy</dt><dd id="acc-proxy">—</dd><dt>IP</dt><dd id="acc-ip">—</dd><dt>Country</dt><dd id="acc-country">—</dd></dl><h2 class="subheading">Exceptions <span class="muted">(open without VPN)</span></h2><label class="switch-row"><input id="bypass-ru" type="checkbox"> <span>All .ru, .su and .рф sites</span></label><form id="exception-form" class="card exception-form"><input id="exception-input" placeholder="example.com" spellcheck="false" autocomplete="off"> <button class="primary" type="submit">Add</button> <button id="exception-current" class="secondary" type="button">Add current site</button></form><ul id="exception-list" class="card exception-list"></ul><p id="exception-message" class="error" hidden></p><button id="update-extension" class="primary update-button" type="button">Update extension</button><p id="update-message" class="hint muted" role="status" hidden></p><button id="forget-all" class="danger-link" type="button">Remove all servers</button></section></main><nav class="tabs"><button class="tab active" data-view="home" type="button"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</button> <button class="tab" data-view="locations" type="button"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Locations</button> <button class="tab" data-view="account" type="button"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-6 8-6s7 1.5 8 6"/></svg>Account</button></nav><script type="module" src="popup.js"></script></body></html>
